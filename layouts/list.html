{{/* Template for a list page: a section such as Projects, or a taxonomy term */}}
{{ define "main" }}
<h1>{{ .Title }}</h1>
{{ .Content }}
<ul>
  {{/* .Pages is every page in this section, ordered by weight then title */}}
  {{ range .Pages }}
  <li><a href="{{ .RelPermalink }}">{{ .Title }}</a></li>
  {{ end }}
</ul>
{{ end }}
