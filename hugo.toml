# Site-wide settings.
# Where the site lives: GitHub Pages, in the ssg-cv-site folder.
baseURL = 'https://hevarh1.github.io/ssg-cv-site/'
locale = 'en'
title = 'Hevar Hemin'
# Build /robots.txt from layouts/robots.txt.
enableRobotsTXT = true
# No /tags/ or /categories/ pages: technologies are shown as plain labels.
disableKinds = ['taxonomy', 'term']

# Values templates read as .Site.Params.* (nothing secret: build-time values are public).
[params]
  description = 'Personal CV and portfolio of Hevar Hemin, software engineer in Erbil, Iraq.'
  author = 'Hevar Hemin'

# Main navigation. weight sets the order; templates loop over .Site.Menus.main.
[menus]
  [[menus.main]]
    name = 'Home'
    pageRef = '/'
    weight = 10
  [[menus.main]]
    name = 'About'
    pageRef = '/about'
    weight = 20
  [[menus.main]]
    name = 'Experience'
    pageRef = '/experience'
    weight = 30
  [[menus.main]]
    name = 'Education'
    pageRef = '/education'
    weight = 40
  [[menus.main]]
    name = 'Skills'
    pageRef = '/skills'
    weight = 50
  [[menus.main]]
    name = 'Projects'
    pageRef = '/projects'
    weight = 60
  [[menus.main]]
    name = 'Contact'
    pageRef = '/contact'
    weight = 70
